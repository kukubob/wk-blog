{% extends "base.html" %}{% block hero %}<div class="pattern-center-blank"></div><div class="pattern-center single-center"><div class="pattern-attachment-img" style="background-image:url('{{ url(post.thumbnail) }}')"></div><header class="pattern-header single-header"><h1 class="entry-title">{{ post.title }}</h1><p class="entry-census">{{ post.author }} <span class="bull">·</span> {{ post.date }}</p></header></div>{% endblock %}
{% block content %}<div id="primary" class="content-area"><main id="main" class="site-main" role="main"><article id="post-{{ post.id }}" class="post type-post status-publish format-standard has-post-thumbnail hentry"><div class="entry-content">{{ body|safe }}</div><footer class="post-footer"><div class="post-tags"><i class="iconfont icon-tags"></i> {{ post.tags|join(' ') }}</div></footer></article>
<nav class="navigation post-navigation" aria-label="文章導覽">{% if previous %}<a href="{{ url(previous.path) }}">{{ previous.title }}</a>{% endif %} {% if next %}<a href="{{ url(next.path) }}">{{ next.title }}</a>{% endif %}</nav></main></div>{% endblock %}
